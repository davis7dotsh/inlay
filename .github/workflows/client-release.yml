name: Client release package

on:
  workflow_dispatch:
  push:
    tags: [client-v*]

permissions:
  contents: read

jobs:
  dist:
    name: Notarized client DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install the Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - run: bun install --frozen-lockfile
      - name: Prepare notary key
        env:
          INLAY_NOTARY_KEY_P8_BASE64: ${{ secrets.INLAY_NOTARY_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$INLAY_NOTARY_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary/AuthKey.p8"
      - name: Import the Developer ID certificate
        env:
          INLAY_CODESIGN_P12_BASE64: ${{ secrets.INLAY_CODESIGN_P12_BASE64 }}
          INLAY_CODESIGN_P12_PASSWORD: ${{ secrets.INLAY_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$INLAY_CODESIGN_P12_BASE64" || -z "$INLAY_CODESIGN_P12_PASSWORD" ]]; then
            echo "::error::Set the INLAY_CODESIGN_P12_BASE64 and INLAY_CODESIGN_P12_PASSWORD secrets to sign the release."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$INLAY_CODESIGN_P12_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$INLAY_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # Prepend the temporary keychain so codesign finds INLAY_CODESIGN_IDENTITY.
          # Each listed path is one quoted line and may contain spaces (no mapfile on bash 3.2).
          keychains=("$keychain")
          while IFS= read -r line; do
            line=${line#"${line%%[![:space:]]*}"}
            line=${line%"${line##*[![:space:]]}"}
            line=${line#\"}
            line=${line%\"}
            if [[ -n "$line" ]]; then keychains+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
      - name: Build server package
        env:
          INLAY_CODESIGN_IDENTITY: ${{ secrets.INLAY_CODESIGN_IDENTITY }}
        run: ./scripts/build-server.sh
      - name: Build, sign, and notarize the client
        env:
          INLAY_CODESIGN_IDENTITY: ${{ secrets.INLAY_CODESIGN_IDENTITY }}
          INLAY_NOTARY_KEY_FILE: ${{ runner.temp }}/notary/AuthKey.p8
          INLAY_NOTARY_KEY_ID: ${{ secrets.INLAY_NOTARY_KEY_ID }}
          INLAY_NOTARY_ISSUER_ID: ${{ secrets.INLAY_NOTARY_ISSUER_ID }}
          INLAY_CLIENT_VERSION: ${{ github.ref_name }}
          INLAY_CLIENT_BUILD: ${{ github.run_number }}
        run: |
          export INLAY_CLIENT_VERSION="${GITHUB_REF_NAME#client-v}"
          ./scripts/build-app.sh --with-server --dist
      - name: Checksum the DMG
        run: shasum -a 256 Inlay.dmg > Inlay.dmg.sha256
        working-directory: build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inlay-client-dmg
          path: |
            build/Inlay.dmg
            build/Inlay.dmg.sha256
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/signing.p12"

  publish:
    name: Publish GitHub Release
    needs: dist
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/client-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-artifacts/Inlay.dmg release-artifacts/Inlay.dmg.sha256
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "Inlay $GITHUB_REF_NAME. Models download separately on first run." \
              release-artifacts/Inlay.dmg release-artifacts/Inlay.dmg.sha256
          fi
