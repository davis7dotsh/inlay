name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft GitHub Release (runs from a v* tag only; branch runs upload artifacts)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run check
      - name: Match the tag to the release version
        id: version
        run: |
          version=$(bun --print 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server:
    name: Server ${{ matrix.platform }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64-cpu
          - runner: ubuntu-24.04-arm
            platform: linux-arm64-cpu
          - runner: ubuntu-24.04
            platform: linux-x64-cuda
            cuda: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !matrix.cuda }}
        with:
          bun-version: 1.4.2
      - name: Install native build dependencies
        if: ${{ !matrix.cuda }}
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev
      - name: Build CPU package
        if: ${{ !matrix.cuda }}
        env:
          INLAY_NATIVE: "OFF"
          INLAY_CUDA: "OFF"
          INLAY_BUILD_JOBS: "4"
        run: ./scripts/build-server.sh
      - name: Build CUDA package
        if: ${{ matrix.cuda }}
        run: docker build -f Server/Dockerfile --target cuda-package --output type=local,dest=build .
      - name: Start the packaged server and check /v1/health
        env:
          EXPECTED_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          openssl rand -hex 32 > "$work/token"
          chmod 600 "$work/token"
          server=build/server
          "$server/inlay-server" --port 8391 --data-dir "$work/data" --token-file "$work/token" \
            --speech-helper "$server/helpers/inlay-engine" --speech-model "$work/no-speech-model.bin" \
            --vad-model "$server/resources/silero-vad.bin" \
            --proof-helper "$server/helpers/inlay-text-engine" --proof-model "$work/no-text-model.gguf" \
            > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8391/v1/liveness >/dev/null 2>&1 && break
            sleep 1
          done
          if ! health=$(curl -fsS -H "Authorization: Bearer $(cat "$work/token")" http://127.0.0.1:8391/v1/health); then
            cat "$work/server.log"
            exit 1
          fi
          echo "$health" | jq '{apiVersion, serverVersion, ready}'
          test "$(echo "$health" | jq -r .serverVersion)" = "$EXPECTED_VERSION"
      - name: Package and checksum
        working-directory: build
        run: |
          set -euo pipefail
          tarball=inlay-server-${{ matrix.platform }}.tar.gz
          tar --owner=0 --group=0 --numeric-owner -czf "$tarball" server
          shasum -a 256 "$tarball" > "$tarball.sha256"
          shasum -a 256 -c "$tarball.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inlay-server-${{ matrix.platform }}
          path: |
            build/inlay-server-${{ matrix.platform }}.tar.gz
            build/inlay-server-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  mac:
    name: Notarized Inlay.dmg and darwin-arm64 server
    needs: checks
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install the Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - run: bun install --frozen-lockfile
      - name: Import the Developer ID certificate and notary key
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_DEVELOPER_ID_CERT_P12_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD APPLE_NOTARY_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name repository secret to sign and notarize the release."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary/AuthKey.p8"
          # A per-run keychain with a random password, deleted at the end of the job.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # Prepend the temporary keychain so codesign finds the identity.
          # Each listed path is one quoted line and may contain spaces (no mapfile on bash 3.2).
          keychains=("$keychain")
          while IFS= read -r line; do
            line=${line#"${line%%[![:space:]]*}"}
            line=${line%"${line##*[![:space:]]}"}
            line=${line#\"}
            line=${line%\"}
            if [[ -n "$line" ]]; then keychains+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ {print $2; exit}')
          if [[ -z "$identity" ]]; then
            echo "::error::The imported certificate has no Developer ID Application identity."
            exit 1
          fi
          echo "INLAY_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build the server package
        env:
          INLAY_NATIVE: "OFF"
          INLAY_BUILD_JOBS: "4"
        run: ./scripts/build-server.sh
      - name: Build, sign, notarize, and staple Inlay.app and Inlay.dmg
        env:
          INLAY_NOTARY_KEY_FILE: ${{ runner.temp }}/notary/AuthKey.p8
          INLAY_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          INLAY_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          INLAY_CLIENT_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          INLAY_CLIENT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          export INLAY_CLIENT_BUILD
          ./scripts/build-app.sh --with-server --dist
      - name: Verify signatures and notarization tickets
        run: |
          set -euo pipefail
          codesign --verify --deep --strict build/Inlay.app
          spctl --assess --type execute -v build/Inlay.app
          xcrun stapler validate build/Inlay.app
          xcrun stapler validate build/Inlay.dmg
      - name: Package the notarized darwin-arm64 server
        working-directory: build
        # The app's bundled server is the Developer ID-signed, hardened, notarized copy.
        run: tar -czf inlay-server-darwin-arm64.tar.gz -C Inlay.app/Contents/Resources -s '/^Server/server/' Server
      - name: Start the packaged server and check /v1/health
        env:
          EXPECTED_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -xzf build/inlay-server-darwin-arm64.tar.gz -C "$work"
          openssl rand -hex 32 > "$work/token"
          chmod 600 "$work/token"
          server="$work/server"
          "$server/inlay-server" --port 8391 --data-dir "$work/data" --token-file "$work/token" \
            --speech-helper "$server/helpers/inlay-engine" --speech-model "$work/no-speech-model.bin" \
            --vad-model "$server/resources/silero-vad.bin" \
            --proof-helper "$server/helpers/inlay-text-engine" --proof-model "$work/no-text-model" \
            > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8391/v1/liveness >/dev/null 2>&1 && break
            sleep 1
          done
          if ! health=$(curl -fsS -H "Authorization: Bearer $(cat "$work/token")" http://127.0.0.1:8391/v1/health); then
            cat "$work/server.log"
            exit 1
          fi
          echo "$health" | jq '{apiVersion, serverVersion, ready}'
          test "$(echo "$health" | jq -r .serverVersion)" = "$EXPECTED_VERSION"
      - name: Checksum
        working-directory: build
        run: |
          set -euo pipefail
          for asset in Inlay.dmg inlay-server-darwin-arm64.tar.gz; do
            shasum -a 256 "$asset" > "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inlay-mac
          path: |
            build/Inlay.dmg
            build/Inlay.dmg.sha256
            build/inlay-server-darwin-arm64.tar.gz
            build/inlay-server-darwin-arm64.tar.gz.sha256
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/signing.p12" build/Inlay-notarize.zip

  publish:
    name: Publish GitHub Release
    needs: [server, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify every asset against its checksum
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          expected=(Inlay.dmg inlay-server-darwin-arm64.tar.gz inlay-server-linux-x64-cpu.tar.gz
            inlay-server-linux-arm64-cpu.tar.gz inlay-server-linux-x64-cuda.tar.gz)
          for asset in "${expected[@]}"; do
            shasum -a 256 -c "$asset.sha256"
          done
          test "$(find . -type f | wc -l)" -eq $(( ${#expected[@]} * 2 ))
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          set -euo pipefail
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Add release notes at $notes before tagging."
            exit 1
          fi
          assets=(release-artifacts/*)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            exit 0
          fi
          flags=()
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Inlay $GITHUB_REF_NAME" --notes-file "$notes" "${flags[@]}" "${assets[@]}"
